content:
  root: content

collections:
  - name: docs
    label: Docs
    folder: content/docs
    create: true
    format: frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: description
        label: Description
        type: string
        required: false

      - name: weight
        label: Weight
        type: number
        required: false

      - name: body
        label: Content
        type: markdown
        required: true
